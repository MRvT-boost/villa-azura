<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You – Villa Azura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --terracotta: #c1694f;
      --dark: #1a2035;
      --mid: #5a6070;
      --white: #ffffff;
      --sand: #f5f0e8;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #2a3555 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--white);
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 3.5rem 3rem;
      max-width: 560px;
      width: 100%;
    }
    .icon {
      width: 72px; height: 72px;
      background: rgba(193,105,79,.2);
      border: 2px solid var(--terracotta);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 2rem;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #90c5e8;
      margin-bottom: 2rem;
      letter-spacing: .04em;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    p {
      color: rgba(255,255,255,.75);
      line-height: 1.8;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    p.sub {
      font-size: .88rem;
      color: rgba(255,255,255,.5);
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--terracotta);
      color: var(--white);
      padding: .85rem 2.2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: .2s;
    }
    .btn:hover { background: #a85843; transform: translateY(-2px); }
    .footer-note {
      margin-top: 2rem;
      font-size: .8rem;
      color: rgba(255,255,255,.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Villa Azura</div>
    <div class="icon">✉️</div>
    <h1>Thank You!</h1>
    <p>Your enquiry was successfully sent. We will get back to you as soon as possible — usually within a few hours.</p>
    <p class="sub">Benissa Costa · Costa Blanca · Spain</p>
    <a href="https://villa-azura.nl" class="btn">← Back to the site</a>
    <div class="footer-note">© 2025 Villa Azura · Licence CV-VUT0454213-A</div>
  </div>
</body>
</html>
